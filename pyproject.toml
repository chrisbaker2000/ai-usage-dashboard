[project]
name = "usagedash"
version = "0.1.0"
description = "Local dashboard tracking quota windows, reset times, and token usage across Claude, Codex, and Grok accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Baker" }]
keywords = ["claude", "codex", "grok", "usage", "quota", "macos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
  "cryptography>=50.0.2",
  "fastapi>=0.142.2",
  "httpx2>=2.13",
  "pydantic>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/chrisbaker2000/ai-usage-dashboard"
Issues = "https://github.com/chrisbaker2000/ai-usage-dashboard/issues"
Security = "https://github.com/chrisbaker2000/ai-usage-dashboard/security/advisories"

[project.scripts]
usagedash = "usagedash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usagedash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "RUF"]
ignore = [
  # Why: every subprocess call here passes a fixed argument list with no shell. The system tools
  # (security, launchctl) are called by absolute path; the vendor CLIs come from configuration.
  "S603",
]

[tool.ruff.lint.per-file-ignores]
# Why: tests assert with `assert` and build synthetic tokens; neither is a real credential or a runtime check.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
